name: Streamix JVM Backend CI

on:
  push:
    branches: [Streamix]
    paths:
      - "streamix-server/**"
      - "settings.gradle.kts"
      - ".github/workflows/streamix-server-ci.yml"
  pull_request:
    branches: [Streamix]
    paths:
      - "streamix-server/**"
      - "settings.gradle.kts"
      - ".github/workflows/streamix-server-ci.yml"

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :streamix-server:test :streamix-server:build
