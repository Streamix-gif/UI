name: Streamix UI CI

on:
  push:
    branches:
      - Streamix
  workflow_dispatch:

concurrency:
  group: streamix-ui-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI: true
      CLOUDSTREAM3_JAR: ${{ runner.temp }}/cs3-classes.jar
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Fetch CloudStream runtime
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 20 --max-time 180 \
            "https://github.com/recloudstream/cloudstream/releases/download/pre-release/classes.jar" \
            -o "$RUNNER_TEMP/cs3-classes.jar"
          test -s "$RUNNER_TEMP/cs3-classes.jar"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: anilab-streamix-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 5
