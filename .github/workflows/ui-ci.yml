name: UI CI

on:
  push:
    branches:
      - main
      - Main
      - versi-1
  pull_request:
    branches:
      - main
      - Main
      - versi-1

concurrency:
  group: ui-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI: true
      CLOUDSTREAM3_JAR: ${{ runner.temp }}/cs3-classes.jar
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Setup JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: 21

      - name: Fetch CloudStream runtime
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 20 --max-time 180 \
            "https://github.com/recloudstream/cloudstream/releases/download/pre-release/classes.jar" \
            -o "$RUNNER_TEMP/cs3-classes.jar"
          test -s "$RUNNER_TEMP/cs3-classes.jar"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Test Saikou-style server core
        run: ./gradlew :streamix-server:test --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: anilab-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 5
