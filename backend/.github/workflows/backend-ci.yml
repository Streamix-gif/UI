name: Backend CI

on:
  push:
    branches: [main, Versi-1]
    paths:
      - "src/**"
      - "sources/**"
      - "social-server/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - ".github/workflows/**"
  pull_request:
    branches: [main, Versi-1]
  workflow_dispatch:

jobs:
  compile-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Fetch CloudStream runtime
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 20 --max-time 180             "https://github.com/recloudstream/cloudstream/releases/download/pre-release/classes.jar"             -o "$RUNNER_TEMP/cs3-classes.jar"
          test -s "$RUNNER_TEMP/cs3-classes.jar"
      - name: Assemble backend
        env:
          CLOUDSTREAM3_JAR: ${{ runner.temp }}/cs3-classes.jar
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :assembleDebug --no-daemon --stacktrace
      - name: Run contract tests
        env:
          CLOUDSTREAM3_JAR: ${{ runner.temp }}/cs3-classes.jar
        run: |
          set -euo pipefail
          ./gradlew :testDebugUnitTest --tests streamix.RuntimeContractTest --tests streamix.identity.ProviderMappingResolverTest --no-daemon --stacktrace
      - name: Build Social JVM backend
        env:
          CLOUDSTREAM3_JAR: ${{ runner.temp }}/cs3-classes.jar
        run: |
          set -euo pipefail
          ./gradlew :social-server:test :social-server:build --no-daemon --stacktrace
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            build/test-results/**
            build/reports/tests/**
            social-server/build/test-results/**
            social-server/build/reports/tests/**
          if-no-files-found: warn
