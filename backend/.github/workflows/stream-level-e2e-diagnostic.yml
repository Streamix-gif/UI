name: Backend compile + contract

on:
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - "sources/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - ".github/workflows/stream-level-e2e-diagnostic.yml"

jobs:
  backend-compile:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Fetch CloudStream runtime
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 20 --max-time 180             "https://github.com/recloudstream/cloudstream/releases/download/pre-release/classes.jar"             -o "$RUNNER_TEMP/cs3-classes.jar"
          test -s "$RUNNER_TEMP/cs3-classes.jar"

      - name: Compile backend
        shell: bash
        env:
          CLOUDSTREAM3_JAR: ${{ runner.temp }}/cs3-classes.jar
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :compileDebugKotlin :compileDebugJavaWithJavac --no-daemon --stacktrace

      - name: Run contract tests only
        shell: bash
        env:
          CLOUDSTREAM3_JAR: ${{ runner.temp }}/cs3-classes.jar
        run: |
          set -euo pipefail
          ./gradlew :testDebugUnitTest             --tests streamix.RuntimeContractTest             --no-daemon --stacktrace

      # Live provider E2E is intentionally not run here.
      # It requires a real Android runtime; Robolectric/JVM cannot load
      # CloudStream's native Conscrypt JNI environment reliably.
      - name: Upload compile/test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-compile-contract-reports
          path: |
            build/test-results/**
            build/reports/tests/**
          if-no-files-found: warn
